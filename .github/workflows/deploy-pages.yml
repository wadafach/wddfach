name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the current Next.js site
        env:
          NEXT_PUBLIC_PAY_QRIS_IMAGE: /pay/qris.jpg
        run: npm run build
      - name: Mark static export for GitHub Pages
        run: touch out/.nojekyll
      - name: Verify current Next.js export
        run: |
          test -f out/index.html
          grep -q "UI/UX · 3D · Game Concept" out/index.html
          ! grep -q "Portfolio Preview" out/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
